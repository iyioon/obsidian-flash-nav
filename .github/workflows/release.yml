name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate release metadata and assets
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: npm run validate:release

      - name: Locate reviewed release notes
        id: notes
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "path=docs/releases/$VERSION.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Flash Navigator ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
            versions.json
